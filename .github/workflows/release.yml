name: Release

# Pushing a tag like v1.4.0 runs the tests, then builds the addon zip and
# uploads it to GitHub Releases and CurseForge.
on:
  push:
    tags:
      - 'v*'

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  # for github releases, this secret is provided automatically; the repo's
  # Actions workflow permissions must be set to read and write
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Test suite
        run: lua5.1 test/harness.lua
      - name: Load order
        run: lua5.1 test/check_load_order.lua

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
